services:
  poker-roots:
    build: .
    image: poker-roots:local
    command: ["sh", "-c", "python -m backend.demo_data --data-dir /data --empty-only && exec python -m backend.api --host 0.0.0.0 --port 8765 --data-dir /data"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - poker_roots_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  poker_roots_data:
